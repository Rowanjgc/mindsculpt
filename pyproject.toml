[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "wsp-workbench"
version = "0.4.0"
description = "A model-agnostic weight-space programming workbench for inspecting, measuring, patching, and reproducing neural network weights."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "WSP Workbench contributors" }]
keywords = ["interpretability", "weights", "pytorch", "safetensors", "research-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "safetensors>=0.4.3",
  "pydantic>=2.6",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
hf = ["transformers>=4.40"]
# Optional instrumentation backend.  Never required: the CPU-only core captures
# activations through plain PyTorch forward hooks.  Pinned to the versions this
# release was validated against.
instrumentation = ["nnsight==0.8.2", "nnterp==2.0.0rc1"]

[project.scripts]
wsp = "wsp.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wsp"]

[tool.hatch.build.targets.sdist]
include = ["src/wsp", "tests", "docs", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "slow: tests that take more than a few seconds",
  "hf: requires the optional transformers dependency",
  "gpu: requires a CUDA-capable device",
  "real_model: requires WSP_REAL_MODEL to point at a local pretrained checkpoint",
]
